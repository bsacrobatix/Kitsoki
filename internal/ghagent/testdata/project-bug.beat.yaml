# project-bug.beat.yaml — drives an onboarded project dev-story instance from a
# bug-labelled GitHub mention. The service supplies appPath from the target
# checkout; this fixture proves the local project route reaches the bugfix
# import without live LLM.
test_kind: flow
app: ../../../stories/dev-story/app.yaml
initial_state: landing
initial_world:
  ticket_id: "42"
  ticket_title: "Bug report from GitHub"
  ticket_type: "bug"
  ticket_url: "https://github.com/o/r/issues/42"
  thread: "github:o/r/issue/42"
  workdir: "."
  workspace_id: "ws-gh-bug-poc"
  base_branch: "main"
  feature_branch: "fix/gh-bug-poc"
  bugfix_destination: "leave-worktree"
  judge_mode: "human"
  gh_job_id: "job-stub"
  gh_origin_ref: "github:o/r/issue/42"
  repo: "o/r"

host_handlers:
  # dev-story's bugfix import resolves iface.workspace.create through the
  # declared Capsule provider. Keep this fixture on that provider so the
  # landing transition cannot silently take its on_error arc.
  host.capsule_workspace: { data: { ok: true, log: "", path: ".capsules/workspaces/ws-gh-bug-poc" } }
  host.git_worktree: { data: { ok: true, log: "", path: ".worktrees/gh-bug-poc" } }
  host.agent.codeact:
    data:
      ok: true
      terminated: done
      payload:
        verdict: STILL-LIVE
        confidence: 0.9
        summary_title: "Known live project bug"
        evidence: "internal/example.go:12 still has the reported behavior."
        summary_markdown: "The project-local bug route entered the bounded triage path."
        suggested_action: "drive the full bugfix pipeline"
        involved_components: ["internal/example.go"]

turns:
  - intent: { name: drive, slots: {} }
    expect_state: bf.triaging
    expect_world:
      ticket_type: "bug"

expect_no_errors: true
