app:
  id: closure-wrapper
  version: 0.1.0
  title: "Closure Wrapper (test fixture)"
  author: Test
  license: CC0

# Mimics /Users/brad/code/POG/.kitsoki/stories/pog-bugfix/app.yaml's shape: a
# THIN world.job -> @kitsoki/bugfix adapter, except this fixture imports the
# UNMODIFIED upstream story directly (`@kitsoki/bugfix`, not a vendored
# in-project copy) to prove storydigest.Compute can seal a cross-repo
# `@kitsoki/<name>` closure. See internal/capsule/storydigest's package doc
# and TestComputeSealsCrossRepoBugfixImport.
#
# Mirrors the full POG wrapper contract, including the delivery-push fields
# (delivery_push_bucket_prefix/delivery_push_ref, and the push_outcome/
# push_error carried back on @exit:shipped) now that upstream bugfix/
# delivery-tail declare them as ordinary optional world_in/world_out keys.

world:
  job:              { type: object, default: {} }
  out_shipped_sha:  { type: string, default: "" }
  out_last_error:   { type: string, default: "" }
  out_exit:         { type: string, default: "" }
  # Delivery-push outcome carried through from bf's own @exit:shipped
  # (world.bf__push_outcome/push_error). dormant (world.job.
  # delivery_push_bucket_prefix unset) | pushed | failed.
  out_push_outcome: { type: string, default: "" }
  out_push_error:   { type: string, default: "" }

intents:
  run:
    description: "Drive the imported bugfix loop off world.job."
    examples: [run, start]
    priority: 90

root: idle

states:
  idle:
    view:
      - prose: "closure wrapper ready"
    on:
      run:
        - target: bf
  done:
    terminal: true
    view:
      - prose: "closure wrapper: {{ world.out_exit }}"

imports:
  bf:
    source: "@kitsoki/bugfix"
    entry: idle

    host_bindings:
      ticket:    host.local_files.ticket
      vcs:       host.git
      ci:        host.local
      workspace: host.capsule_workspace
      transport: host.append_to_file

    world_in:
      ticket_id:            "{{ world.job.ticket_id }}"
      ticket_title:         "{{ world.job.ticket_title }}"
      ticket_body:          "{{ world.job.ticket_body }}"
      ticket_source_mode:   "freeform"

      base_branch:          "{{ world.job.base_branch }}"
      base_commit:          "{{ world.job.base_commit }}"

      gate_command:         "{{ world.job.gate_command }}"
      test_cmd:             "{{ world.job.test_cmd }}"
      build_cmd:            "{{ world.job.build_cmd }}"
      default_landing_gate: "{{ world.job.default_landing_gate }}"

      acceptance_contract:  "{{ world.job.acceptance_contract }}"

      audit_actor:          "{{ world.job.audit_actor }}"
      audit_mode:           "{{ world.job.audit_mode }}"

      bugfix_exit:          "{{ world.job.bugfix_exit }}"

      auto_triage:          "{{ world.job.auto_triage }}"
      escalate_low_value:   "{{ world.job.escalate_low_value }}"

      judge_mode:           "{{ world.job.judge_mode }}"

      # Optional delivery-push config, resolved once at seal time alongside
      # every other world.job field. Empty bucket_prefix (the default) leaves
      # bf's ship-it tail's delivery-push step a pure no-op.
      delivery_push_bucket_prefix: "{{ world.job.delivery_push_bucket_prefix }}"
      delivery_push_ref:           "{{ world.job.delivery_push_ref }}"

    exits:
      shipped:
        to: done
        set:
          out_shipped_sha: "{{ world.bf__shipped_sha }}"
          out_exit: "shipped"
          out_push_outcome: "{{ world.bf__push_outcome }}"
          out_push_error:   "{{ world.bf__push_error }}"
      needs-human:
        to: done
        set:
          out_last_error: "{{ world.bf__last_error }}"
          out_exit: "needs-human"
      not-reproducible:
        to: done
        set:
          out_last_error: "{{ world.bf__last_error }}"
          out_exit: "not-reproducible"
      abandoned:
        to: done
        set:
          out_exit: "abandoned"
      pick_ticket:
        to: done
        set:
          out_exit: "pick_ticket"
      done:
        to: done
        set:
          out_exit: "done"
      merged:
        to: done
        set:
          out_exit: "merged"
      triaged:
        to: done
        set:
          out_exit: "triaged"
