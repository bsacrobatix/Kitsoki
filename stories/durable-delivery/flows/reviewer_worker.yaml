test_kind: flow
app: ../app.yaml
initial_state: idle

host_handlers:
  host.work_queue_worker:
    by_call:
      claim_reviewer:
        data:
          claimed: true
          work_ref: wq-review-1
          queue: delivery-reviewer
          payload:
            candidate_id: queue-1
            project: /repo
            workdir: /workspace
            fixer_work_ref: wq-fix-1
            bundle_ref: bundles/fix-1.bundle
            bundle_digest: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
            bundle_kind: git-bundle
            fixer_trace_ref: trace-fixer-1
          fence: 9
          attempt: 1
      complete_reviewer:
        data: { work_ref: wq-review-1, queue: delivery-reviewer, status: succeeded, fence: 9, attempt: 1 }
  host.agent.task:
    by_call:
      run_reviewer:
        delay: "10ms"
        data:
          submitted:
            passed: true
            summary: "Tests and policy remain at least as strong."
            trace_ref: trace-reviewer-1

turns:
  - intent: { name: work_reviewer }
    advance_clock: "100ms"
    expect_state: worker_done
    expect_world:
      work_ref: wq-review-1
      fence: 9
      task_result:
        passed: true
        summary: "Tests and policy remain at least as strong."
        trace_ref: trace-reviewer-1

expect_no_errors: true
