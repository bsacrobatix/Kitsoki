test_kind: flow
app: ../app.yaml
initial_state: idle

host_handlers:
  host.work_queue_worker:
    by_call:
      claim_fixer:
        data:
          claimed: true
          work_ref: wq-fix-red
          queue: delivery-fixer
          payload: { candidate_id: queue-red, project: /repo, workdir: /workspace, failure_context: "gate failed" }
          fence: 11
          attempt: 1
      fail_fixer:
        data: { work_ref: wq-fix-red, queue: delivery-fixer, status: failed, fence: 11, attempt: 1 }
  host.agent.task:
    by_call:
      run_fixer:
        delay: "10ms"
        data:
          submitted:
            passed: false
            summary: "The failure requires an unsafe product decision."
            trace_ref: trace-fixer-red

turns:
  - intent: { name: work_fixer }
    advance_clock: "100ms"
    expect_state: worker_failed
    expect_world:
      work_ref: wq-fix-red
      task_result:
        passed: false
        summary: "The failure requires an unsafe product decision."
        trace_ref: trace-fixer-red

expect_no_errors: true
