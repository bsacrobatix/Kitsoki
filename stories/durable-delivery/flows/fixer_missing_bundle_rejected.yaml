test_kind: flow
app: ../app.yaml
initial_state: idle

host_handlers:
  host.work_queue_worker:
    by_call:
      claim_fixer:
        data:
          claimed: true
          work_ref: wq-fix-invalid
          queue: delivery-fixer
          payload: { candidate_id: queue-invalid, project: /repo, workdir: /workspace, failure_context: "gate failed" }
          fence: 17
          attempt: 1
      fail_fixer:
        data: { work_ref: wq-fix-invalid, queue: delivery-fixer, status: failed, fence: 17, attempt: 1 }
  host.agent.task:
    by_call:
      run_fixer:
        delay: "10ms"
        data:
          submitted:
            passed: true
            summary: "Claims success but omitted the retained bundle."
            trace_ref: trace-fixer-invalid

turns:
  - intent: { name: work_fixer }
    advance_clock: "100ms"
    expect_state: worker_failed

expect_no_errors: true
