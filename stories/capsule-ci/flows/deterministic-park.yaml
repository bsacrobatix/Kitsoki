# A project gate that requests authority must produce the typed parked result.
test_kind: flow
app: capsule-ci
initial_state: idle
initial_world:
  ci_job_id: job-fixture-park
  ci_pipeline: change
  ci_source: { digest: sha256:source }
  ci_environment: { digest: sha256:environment }
  ci_trigger:
    story_digest: sha256:story
    envelope_digest: sha256:envelope
host_cassette: cassettes/project-checks-park.cassette.yaml
turns:
  - intent: { name: run, slots: {} }
    expect_state: parked
    expect_world:
      ci_outcome: needs_input
      ci_verdict:
        schema: capsule-ci-verdict/v1
        pipeline: change
        outcome: needs_input
        summary: "Project gate needs an approved input."
        checks: []
        promotion_eligible: false
        source_digest: sha256:source
        story_digest: sha256:story
        environment_digest: sha256:environment
        envelope_digest: sha256:envelope
expect_no_errors: true
