app:
  id: linkedin-job-search
  version: 0.1.0
  title: "LinkedIn current results reader"
  author: "Kitsoki"
  license: "CC0"
hosts: [host.agent.task]
agents:
  linkedin_results_reader:
    system_prompt: |
      Read the already-open paired LinkedIn Jobs results tab. In Codex, first use tool_search with raw query `linkedin_story`, then invoke only the returned bridge tool exactly twice: first `{"action":"snapshot"}`, then `{"action":"extract"}`. Do not navigate, click, fill, press, open jobs, alter filters, or paginate. Return `{current_url, remote_visible, cards, action_audit}`. `current_url` must be a LinkedIn Jobs search-results URL, `remote_visible` must be true only when the visible page shows Remote, and each card must summarize only visible title, company, location, and posted text.
    tools: []
    mcp:
      servers:
        sassfully_browser:
          command: "node"
          args: ["/Users/brad/code/studio-sassfully/.capsules/workspaces/extension-local-test-20260730/packages/feedback-extension/story-bridge/stdio-server.mjs", "--pairing-code", "${SASSFULLY_LINKEDIN_PAIRING_CODE}"]
      tools: [mcp__sassfully_browser__linkedin_story]
    permissions:
      mode: ask
      disallowed_tools: [Read, Grep, Glob, LS, NotebookRead, TodoRead, TodoWrite, Write, Edit, MultiEdit, NotebookEdit, Bash, WebFetch, WebSearch]
    effect: external
world:
  inspection: { type: object, default: {} }
  current_url: { type: string, default: "" }
  remote_visible: { type: bool, default: false }
  cards: { type: array, default: [] }
  action_audit: { type: array, default: [] }
  error_detail: { type: string, default: "" }
intents:
  inspect_current: { description: "Read the current paired Jobs results.", examples: ["inspect current", "read current results"], priority: 90 }
  finish: { description: "Record the current visible Jobs results.", examples: ["finish"], priority: 84 }
  look: { description: "Re-render the current state.", examples: ["look", "status"], priority: 10 }
root: ready
include: [rooms/*.yaml]
