app:
  id: linkedin-job-search
  version: 0.1.0
  title: "LinkedIn paired-tab search"
  author: "Kitsoki"
  license: "CC0"
hosts: [host.agent.task]
agents:
  linkedin_searcher:
    system_prompt: |
      Drive one paired LinkedIn tab session from the user's terms and return only visible extracted output. In Codex, first use tool_search with raw query `linkedin_story`, then use only the returned bridge tool with action navigate, snapshot, click, fill, press, or extract as needed. Finish with exactly one extract and return its visible output, current URL, and a concise action outcome audit. Do not use any other tool.
    tools: []
    mcp:
      servers:
        sassfully_browser:
          command: "node"
          args: ["/Users/brad/code/studio-sassfully/.capsules/workspaces/extension-local-test-20260730/packages/feedback-extension/story-bridge/stdio-server.mjs", "--pairing-code", "${SASSFULLY_LINKEDIN_PAIRING_CODE}"]
      tools: [mcp__sassfully_browser__linkedin_story]
    permissions:
      mode: ask
      disallowed_tools: [Read, Grep, Glob, LS, NotebookRead, TodoRead, TodoWrite, Write, Edit, MultiEdit, NotebookEdit, Bash, WebFetch, WebSearch]
    effect: external
world:
  keywords: { type: string, default: "" }
  location: { type: string, default: "" }
  search_status: { type: string, default: "draft" }
  search_result: { type: object, default: {} }
  extracted_output: { type: string, default: "" }
  current_url: { type: string, default: "" }
  action_audit: { type: array, default: [] }
  error_detail: { type: string, default: "" }
intents:
  prepare:
    description: "Run a paired-tab LinkedIn search from terms."
    examples: ["search jobs", "prepare a job search"]
    priority: 90
    slots:
      keywords: { type: string, required: true }
      location: { type: string, required: false }
  finish: { description: "Record extracted visible output.", examples: ["finish"], priority: 84 }
  cancel: { description: "Cancel the search.", examples: ["cancel", "stop"], priority: 75 }
  look: { description: "Re-render the current state.", examples: ["look", "status"], priority: 10 }
root: parameters
include: [rooms/*.yaml]
