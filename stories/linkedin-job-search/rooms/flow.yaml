states:
  ready:
    description: "Wait for the operator to read the current paired Jobs results."
    view:
      extends: "base"
      blocks:
        body:
          - prose: "Ready to read the current paired LinkedIn Jobs results page without changing it."
        choices:
          - heading: "Actions"
          - list: { items: [{ label: "inspect_current", hint: "snapshot and extract the current page" }, { label: "look" }] }
    on:
      inspect_current: [{ target: inspect_current }]
      look: [{ target: . }]
  inspect_current:
    description: "Read the current paired LinkedIn Jobs results page."
    relevant_world: [current_url, remote_visible, cards, error_detail]
    view:
      extends: "base"
      blocks:
        body:
          - prose: "Reading the current paired LinkedIn Jobs results page without changing it."
          - kv: { pairs: { Current_URL: "{{ world.current_url|default:'(pending)' }}", Remote: "{{ world.remote_visible }}" } }
    on_enter:
      - invoke: host.agent.task
        id: inspect_current_paired_tab
        once: true
        with:
          agent: linkedin_results_reader
          acceptance: { schema: schemas/search-result.json }
          context: { prompt: prompts/inspect-current.md }
        bind:
          inspection: submitted
          current_url: submitted.current_url
          remote_visible: submitted.remote_visible
          cards: submitted.cards
          action_audit: submitted.action_audit
        on_error: failed
      - when: "world.current_url != '' && world.remote_visible == true"
        emit_intent: finish
    on:
      finish: [{ target: complete }]
      look: [{ target: . }]
  complete:
    description: "Current Remote LinkedIn Jobs results captured."
    terminal: true
    relevant_world: [current_url, remote_visible, cards, action_audit]
    view:
      extends: "base"
      blocks:
        body:
          - prose: "Captured the current Remote LinkedIn Jobs results without changing the tab."
          - kv: { pairs: { Current_URL: "{{ world.current_url }}", Remote: "{{ world.remote_visible }}" } }
          - code: "{{ world.cards }}"
  failed:
    description: "The current tab is not ready for read-only Jobs extraction."
    relevant_world: [error_detail, last_error, host_error]
    view:
      extends: "base"
      blocks:
        body:
          - prose: "Could not read a current Remote LinkedIn Jobs results page."
          - kv: { pairs: { Error: "{{ world.error_detail|default:world.host_error.message|default:world.last_error|default:'(no result)' }}" } }
    on: { look: [{ target: . }] }
