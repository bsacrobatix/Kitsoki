states:
  parameters:
    description: "Collect paired-tab search terms."
    relevant_world: [keywords, search_status]
    view:
      extends: "base"
      blocks:
        body:
          - prose: "Give me LinkedIn search terms. The paired-tab agent will return visible extracted output."
          - kv: { pairs: { Terms: "{{ world.keywords|default:'(not yet chosen)' }}", Status: "{{ world.search_status }}" } }
        choices:
          - heading: "Actions"
          - list: { items: [{ label: "prepare keywords=…", hint: "run the paired-tab search" }, { label: "cancel" }, { label: "look" }] }
    on:
      prepare:
        - target: searching
          effects:
            - set:
                keywords: "{{ slots.keywords }}"
                location: "{{ slots.location }}"
                search_status: "running"
                search_result: {}
                extracted_output: ""
                current_url: ""
                action_audit: []
                error_detail: ""
      cancel: [{ target: cancelled }]
      look: [{ target: . }]
  searching:
    description: "Drive the paired tab and capture visible output."
    relevant_world: [keywords, search_status, extracted_output, current_url]
    view:
      extends: "base"
      blocks:
        body:
          - prose: "The paired-tab agent is running the requested search and will capture visible output."
          - kv: { pairs: { Terms: "{{ world.keywords }}", Status: "{{ world.search_status }}", Current_URL: "{{ world.current_url|default:'(pending)' }}" } }
        choices:
          - heading: "Actions"
          - list: { items: [{ label: "look" }] }
    on_enter:
      - invoke: host.agent.task
        id: drive_paired_linkedin_session
        once: true
        with:
          agent: linkedin_searcher
          acceptance: { schema: schemas/search-result.json }
          context:
            prompt: prompts/submit-search.md
            args: { keywords: "{{ world.keywords }}", location: "{{ world.location }}" }
        bind:
          search_result: submitted
          extracted_output: submitted.visible_output
          current_url: submitted.current_url
          action_audit: submitted.action_audit
        on_error: failed
      - when: "world.extracted_output != ''"
        emit_intent: finish
    on:
      finish: [{ target: complete, effects: [{ set: { search_status: "complete" } }] }]
      look: [{ target: . }]
  complete:
    description: "Paired-tab search completed with visible output captured."
    terminal: true
    relevant_world: [keywords, search_status, current_url, extracted_output]
    view:
      extends: "base"
      blocks:
        body:
          - prose: "The paired-tab search completed and captured visible output."
          - kv: { pairs: { Status: "{{ world.search_status }}", Terms: "{{ world.keywords }}", Current_URL: "{{ world.current_url }}" } }
          - code: "{{ world.extracted_output }}"
  failed:
    description: "Paired-tab session failed."
    relevant_world: [error_detail, last_error, host_error]
    view:
      extends: "base"
      blocks:
        body:
          - prose: "The paired-tab session failed."
          - kv: { pairs: { Error: "{{ world.error_detail|default:world.host_error.message|default:world.last_error|default:'(no result)' }}" } }
    on: { look: [{ target: . }], cancel: [{ target: cancelled }] }
  cancelled:
    description: "Search cancelled."
    terminal: true
    view:
      extends: "base"
      blocks: { body: [{ prose: "Cancelled." }] }
