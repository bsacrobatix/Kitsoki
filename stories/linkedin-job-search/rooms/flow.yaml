states:
  parameters:
    description: "Collect LinkedIn Jobs keywords without browser activity."
    relevant_world: [keywords, location, search_url, search_status]
    view:
      extends: "base"
      blocks:
        body:
          - prose: "I will construct one base US LinkedIn Jobs URL. No browser action happens until you review it and explicitly confirm."
          - kv:
              pairs:
                Keywords: "{{ world.keywords|default:'(not yet chosen)' }}"
                Location: "United States; Remote filter selected after confirmation"
                Direct URL: "{{ world.search_url|default:'(created after prepare)' }}"
                Status: "{{ world.search_status }}"
        choices:
          - heading: "Actions"
          - list:
              items:
                - label: "prepare keywords=…"
                  hint: "review the direct US URL before navigation and remote selection"
                - label: "cancel"
                  hint: "end without opening or searching LinkedIn"
                - label: "look"
    on:
      prepare:
        - target: review
          effects:
            - set:
                keywords: "{{ slots.keywords }}"
                location: "United States; Remote"
                search_url: "https://www.linkedin.com/jobs/search-results/?keywords={{ urlqueryescape(slots.keywords) }}&geoId=103644278"
                search_status: "awaiting_confirmation"
                confirmed: false
                results_url: ""
                used_parameters: {}
                prepared_parameters: { keywords: "{{ slots.keywords }}", location: "United States; Remote" }
                search_result: {}
                error_detail: ""
      cancel:
        - target: cancelled
      look:
        - target: .

  review:
    description: "Require explicit confirmation immediately before direct LinkedIn Jobs navigation."
    relevant_world: [keywords, location, search_url, search_status, confirmed]
    view:
      extends: "base"
      blocks:
        body:
          - prose: "Confirm one direct US LinkedIn Jobs URL navigation. Chrome will show Allow confirmations for navigation and the constrained Remote filter selection; the story will then snapshot the safe current URL."
          - kv:
              pairs:
                Keywords: "{{ world.keywords }}"
                Location: "{{ world.location|default:'(any location)' }}"
                Direct URL: "{{ world.search_url }}"
                Status: "{{ world.search_status }}"
        choices:
          - heading: "Required decision"
          - list:
              items:
                - label: "confirm_search"
                  hint: "navigate once, select Remote once, then verify"
                - label: "revise"
                  hint: "return without submitting"
                - label: "cancel"
                  hint: "end without submitting"
                - label: "look"
    on:
      confirm_search:
        - target: searching
          effects:
            - set:
                confirmed: true
                search_status: "submitting_confirmed_search"
      revise:
        - target: parameters
          effects:
            - set: { search_status: "draft", confirmed: false }
      cancel:
        - target: cancelled
      look:
        - target: .

  searching:
    description: "Navigate once to the confirmed direct LinkedIn Jobs URL and verify it."
    relevant_world: [keywords, location, search_url, search_status, results_url, used_parameters, error_detail]
    view:
      extends: "base"
      blocks:
        body:
          - prose: "The confirmed browser action is running through the configured local Sassfully bridge. It is limited to one direct Jobs URL navigation, one constrained Remote selection, and one safe URL snapshot."
          - kv:
              pairs:
                Status: "{{ world.search_status }}"
                Keywords: "{{ world.keywords }}"
                Location: "{{ world.location|default:'(any location)' }}"
                Direct URL: "{{ world.search_url }}"
                Results URL: "{{ world.results_url|default:'(pending)' }}"
                Error: "{{ world.error_detail|default:'(none)' }}"
        choices:
          - heading: "Actions"
          - list:
              items:
                - label: "look"
    on_enter:
      - invoke: host.agent.task
        id: navigate_confirmed_linkedin_jobs_url
        once: true
        with:
          agent: linkedin_searcher
          acceptance:
            schema: schemas/search-result.json
          context:
            prompt: prompts/submit-search.md
            args:
              keywords: "{{ world.keywords }}"
              location: "{{ world.location }}"
              search_url: "{{ world.search_url }}"
              confirmation: "{{ world.confirmed }}"
        bind:
          search_result: submitted
          results_url: submitted.results_url
          used_parameters: submitted.parameters
        on_error: failed
      - when: "world.results_url != ''"
        emit_intent: finish
    on:
      finish:
        - target: complete
          effects:
            - set: { search_status: "complete" }
      look:
        - target: .

  complete:
    description: "Confirmed LinkedIn Jobs direct URL navigation completed with its URL captured."
    terminal: true
    relevant_world: [keywords, location, search_status, results_url, used_parameters]
    view:
      extends: "base"
      blocks:
        body:
          - prose: "The attended LinkedIn Jobs navigation completed. The story captured the requested parameters and verified URL; it did not inspect job details or collect result rows."
          - kv:
              pairs:
                Status: "{{ world.search_status }}"
                Keywords: "{{ world.used_parameters.keywords|default:world.keywords }}"
                Location: "{{ world.used_parameters.location|default:world.location }}"
                Results URL: "{{ world.results_url }}"

  failed:
    description: "Configured bridge or search operation failed without a retrying side effect."
    relevant_world: [keywords, location, error_detail]
    view:
      extends: "base"
      blocks:
        body:
          - prose: "No additional browser action will be attempted automatically. Check the local Sassfully bridge configuration, then prepare the search again if you still want to submit it."
          - kv:
              pairs:
                Error: "{{ world.error_detail|default:$host_error.hint|default:'(bridge did not return a result)' }}"
        choices:
          - heading: "Actions"
          - list:
              items:
                - label: "revise"
                  hint: "return without retrying"
                - label: "cancel"
                  hint: "end"
                - label: "look"
    on:
      revise:
        - target: parameters
          effects:
            - set: { search_status: "draft", confirmed: false }
      cancel:
        - target: cancelled
      look:
        - target: .

  cancelled:
    description: "Search cancelled before submission."
    terminal: true
    relevant_world: [keywords, location]
    view:
      extends: "base"
      blocks:
        body:
          - prose: "Cancelled. No LinkedIn Jobs search was submitted by this story."
