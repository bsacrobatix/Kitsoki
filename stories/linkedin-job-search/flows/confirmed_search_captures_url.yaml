test_kind: flow
app: ../app.yaml
initial_state: parameters
host_handlers:
  host.agent.task:
    by_call:
      navigate_confirmed_linkedin_jobs_url:
        data:
          ok: true
          submitted:
            results_url: "https://www.linkedin.com/jobs/search-results/?keywords=Product+Manager&geoId=103644278&f_WT=2"
            parameters:
              keywords: "Product Manager"
              location: "United States; Remote"
turns:
  - intent:
      name: prepare
      slots: { keywords: "Product Manager", location: "Bangkok" }
    expect_state: review
    expect_world:
      search_status: "awaiting_confirmation"
      confirmed: false
      prepared_parameters: { keywords: "Product Manager", location: "United States; Remote" }
      search_url: "https://www.linkedin.com/jobs/search-results/?keywords=Product+Manager&geoId=103644278"
    expect_no_host_calls: [host.agent.task]
  - intent: { name: confirm_search }
    expect_state: complete
    expect_world:
      search_status: "complete"
      results_url: "https://www.linkedin.com/jobs/search-results/?keywords=Product+Manager&geoId=103644278&f_WT=2"
      used_parameters: { keywords: "Product Manager", location: "United States; Remote" }
    expect_host_calls:
      - handler: host.agent.task
        args: { call: "navigate_confirmed_linkedin_jobs_url" }
