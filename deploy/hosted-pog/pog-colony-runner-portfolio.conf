[Service]
# The colony dispatches cross-repository feedback itself, so it needs the same
# deterministic federation authority as the portal instead of release-layout
# heuristics. This file is rendered by install.sh from the same member_roots
# value used for pog-portal.service.
Environment=POG_PORTFOLIO_ROOT=/opt/pog/current
Environment=POG_MEMBER_ROOTS=__POG_MEMBER_ROOTS__
Environment=POG_PORTFOLIO_MEMBERS=__POG_PORTFOLIO_MEMBERS__
# Cross-repo proposal children must use the activated immutable hosted engine,
# not a release-local artifact-cache binary.
Environment=POG_KITSOKI_BIN=/opt/kitsoki-hosted-pog/current/kitsoki
