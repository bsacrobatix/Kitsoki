[Service]
# This is intentionally a hosted-POG-only override.  `/usr/local/bin/kitsoki`
# remains the independently pinned seal/control binary used to make the
# worker-image story closure; do not repoint it during a portal deploy.
# The exact-revision lifecycle helper is shipped beside the hosted binary.
# Never point this service at a mutable source checkout: doing so keeps
# orchestrator-local Capsules alive and defeats the read-only host boundary.
Environment=KITSOKI_SOURCE_DIR=/opt/kitsoki-hosted-pog/current
# install.sh places the federated source bundle here. Keep the queue gate on
# that immutable deployed member rather than a developer checkout path.
Environment=POG_GEARS_RUST_SRC=/opt/pog/members/gears-rust
ExecStart=
ExecStart=/opt/kitsoki-hosted-pog/current/kitsoki queue worker --project "${PROJECT_ROOT}" --target "${TARGET}" --gate "${GATE}" --concurrency "${CONCURRENCY}" --retry-delay "${RETRY_DELAY}" --max-retry-delay "${MAX_RETRY_DELAY}" --max-attempts "${MAX_ATTEMPTS}"
