[Service]
# This is intentionally a hosted-POG-only override.  `/usr/local/bin/kitsoki`
# remains the independently pinned seal/control binary used to make the
# worker-image story closure; do not repoint it during a portal deploy.
# The exact-revision lifecycle helper is shipped beside the hosted binary.
# Never point this service at a mutable source checkout: doing so keeps
# orchestrator-local Capsules alive and defeats the read-only host boundary.
Environment=KITSOKI_SOURCE_DIR=/opt/kitsoki-hosted-pog/current
# install.sh places the federated source bundle here.  The protected project
# catalog resolves vm-pool's production image pointer from this host's
# operator-owned /etc/kitsoki/worker-image.json; a workstation must never
# guess or copy that pointer.
Environment=POG_GEARS_RUST_SRC=/opt/pog/members/gears-rust
ExecStart=
# Remote admission owns this durable queue root outside the protected project;
# it is deliberately a literal rather than an optional environment value so a
# missing setting can never fall back to PROJECT_ROOT/.capsules/queue.  The
# host continues to own shared VM-pool state below /var/lib/pog/capsules.
# Do not replace this with --gate: a local prospective-tree gate creates
# controller workspaces and defeats the read-only Mac boundary.
ExecStart=/opt/kitsoki-hosted-pog/current/kitsoki queue worker --project "${PROJECT_ROOT}" --queue-root /var/lib/kitsoki-queue-admission/pog/queue --target "${TARGET}" --executor vm-pool --executor-pipeline change --concurrency "${CONCURRENCY}" --retry-delay "${RETRY_DELAY}" --max-retry-delay "${MAX_RETRY_DELAY}" --max-attempts "${MAX_ATTEMPTS}"
