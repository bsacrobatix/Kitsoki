story_dirs:
  - /opt/pog/current/stories

auth:
  mode: required
  public_url: __PUBLIC_BASE_URL__
  github:
    client_id: __GITHUB_CLIENT_ID__
    client_secret: ${KITSOKI_HOSTED_POG_GH_CLIENT_SECRET}
  admins:
    - __GITHUB_ADMIN__
  session_ttl: 168h
  # Headless same-host automation (the POG colony runner) authenticates with
  # a bearer token instead of a browser session. Name-only here; install.sh
  # mints/reuses the value in /etc/kitsoki/hosted-pog.env and mirrors it to
  # the colony runner as POG_RUNNER_TOKEN. See docs/architecture/web-auth.md.
  service_tokens:
    colony: KITSOKI_COLONY_TOKEN
