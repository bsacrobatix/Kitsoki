# ack_error: proof (.context/troubleshooting-agent-and-error-integrity.md,
# the "missing primitive" section): a host DOMAIN failure whose invoke:
# declares `ack_error: "<reason>"` instead of `on_error:` must still (a)
# append a world.error_log entry — durability is NOT waived, class:
# host_domain, handled: true, handled_reason: the ack_error: string — but
# (b) must NOT surface the never-silent "⚠ Action failed:" banner in the
# rendered view, unlike working_unhandled's sibling flow
# (unhandled_domain_error_banners_and_logs.yaml), which has no ack_error:
# and therefore does banner.
#
# expect_view_matches is anchored (^...$) to the room's own two-line view
# with nothing appended — if applyErrorBannerSeam fired, the extra
# "\n\n⚠ Action failed: ..." suffix would break the anchored match.
#
# To run:
#   go run ./cmd/kitsoki test flows testdata/apps/error_banner/app.yaml

test_kind: flow
app: ../app.yaml
initial_state: lobby

host_handlers:
  host.run:
    error: "simulated acked domain failure"
    data: { exit_code: 3, ok: false, stderr: "boom on stderr (acked)" }

turns:
  - intent: { name: do_thing_acked, slots: {} }
    expect_state: working_acked
    expect_view_matches: "^Running…\n$"
    expect_world:
      last_error: "simulated acked domain failure"
      error_origin: "working_acked"
      error_log:
        - seq: 1
          state: "working_acked"
          namespace: "host.run"
          effect: "write"
          message: "simulated acked domain failure"
          exit_code: 3
          stderr: "boom on stderr (acked)"
          class: "host_domain"
          handled: true
          handled_reason: "flow-fixture: acknowledged failure, safe to continue"
          ts: "1970-01-01T00:00:00Z"

expect_terminal: false
