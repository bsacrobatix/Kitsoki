# error_banner — minimal app proving the runtime surfaces a host failure even
# when the on_error: destination room does NOT render {{ world.last_error }}.
#
# RED gate: with the plain error room below, expect_view_matches "Action failed"
# fails today (the room hides the error). GREEN after the orchestrator appends
# its on_error redirect banner (see .context/error-banner-brief.md).
#
# No LLM: the lone host call (host.run) is stubbed to a domain error via the
# flow's host_handlers error: field, so the on_error: arc fires deterministically.

app:
  id: error-banner-demo
  version: 0.1.0
  title: "Error Banner Demo"

hosts:
  - host.run

# working_unhandled deliberately declares no on_error: on its invoke: — it
# is the leak-1 / no-on_error: fixture the G-FLOW unhandled-error gate tests
# (gflow_unhandled_gate_test.go) assert stays genuinely unhandled. Opt out
# of the builtin error room explicitly so it keeps that shape regardless of
# builtinErrorRoomDefaultOn (internal/app/builtin_error_room.go).
on_error_default: none

world:
  last_error: { type: string, default: "" }

intents:
  do_thing:
    title: "Do the thing"
    description: "Run a host command that will fail."
    examples: ["do it", "go", "run"]
  do_thing_silently:
    title: "Do the thing (wipes last_error on arrival)"
    description: "Run a host command that will fail, landing in a room that clears world.last_error before rendering."
    examples: ["do it quietly", "go quiet", "run silent"]
  do_thing_unhandled:
    title: "Do the thing (no on_error: declared)"
    description: "Run a host command that will fail with NO on_error: arc — the leak-1 / error_log flow-test surface (.context/troubleshooting-agent-and-error-integrity.md Part 1)."
    examples: ["do it unhandled", "go unhandled", "run unhandled"]
  do_thing_silently_logged:
    title: "Do the thing (wipes last_error, but the room renders from error_log)"
    description: "Like do_thing_silently, but the destination room sources its own banner text from world.error_log instead of world.last_error — proving the durable log outlives the single-slot clear."
    examples: ["do it quietly but log it"]
  do_thing_acked:
    title: "Do the thing (ack_error: declared)"
    description: "Run a host command that will fail with ack_error: declared — the deliberate 'record it, keep going, no banner' primitive (.context/troubleshooting-agent-and-error-integrity.md)."
    examples: ["do it acked", "go acked", "run acked"]

root: lobby

states:
  lobby:
    description: "Lobby — type 'do it' to run the failing command."
    view: |
      Lobby. Type 'do it' to run the command.
    on:
      do_thing:
        - target: working
      do_thing_silently:
        - target: working_silent
      do_thing_unhandled:
        - target: working_unhandled
      do_thing_silently_logged:
        - target: working_silent_logged
      do_thing_acked:
        - target: working_acked

  working:
    description: "Running the command…"
    view: |
      Running…
    on_enter:
      - invoke: host.run
        with:
          cmd: "false"
        on_error: bounced

  # The PLAIN error room — deliberately does NOT reference world.last_error.
  # This is the silent-bounce trust-killer the engine fix targets.
  bounced:
    terminal: true
    description: "Back at the lobby."
    view: |
      Back at the lobby. Try again when ready.

  working_silent:
    description: "Running the command (silent variant)…"
    view: |
      Running…
    on_enter:
      - invoke: host.run
        with:
          cmd: "false"
        on_error: bounced_silent

  # bounced_silent_gap: the on_error: target's own on_enter clears
  # world.last_error before the shared applyErrorBannerSeam (host_dispatch.go)
  # gets to inspect it — applyErrorBannerSeam only fires when last_error is a
  # non-empty string, so a room that wipes it (whether by an authored `set:`
  # step or any on_enter logic that resets diagnostic state) still produces a
  # bannerless, silent-bounce view even though the shared seam is in place.
  # This is exactly the case the G-FLOW gate (Task 2.2) exists to catch,
  # independent of the banner seam itself: it flags ANY on_error: transition
  # whose final rendered view lacks the marker, regardless of why.
  bounced_silent:
    terminal: true
    description: "Back at the lobby (silently)."
    on_enter:
      - set:
          last_error: ""
    view: |
      Back at the lobby. Try again when ready.

  # working_unhandled: NO on_error: on the invoke:, and deliberately no `on:`
  # handlers either — a failed call here has nowhere to redirect to and no
  # further intent to advance on, so the session simply stays put after the
  # call fails (see unhandled_domain_error_banners_and_logs.yaml /
  # unhandled_infra_error_banners_and_logs.yaml: leak-1 proof that the
  # never-silent banner + world.error_log still fire on the no-on_error
  # continue-the-chain path).
  working_unhandled:
    description: "Running the command (no on_error: declared)…"
    view: |
      Running…
    on_enter:
      - invoke: host.run
        with:
          cmd: "false"

  working_silent_logged:
    description: "Running the command (silent variant, logged)…"
    view: |
      Running…
    on_enter:
      - invoke: host.run
        with:
          cmd: "false"
        on_error: bounced_silent_logged

  # bounced_silent_logged: like bounced_silent, clears world.last_error on
  # arrival — but sources its OWN banner text from world.error_log (the
  # durable append-only log, not the single-slot last_error view) so it
  # passes rather than fails the G-FLOW gate. Proves the log survives a
  # legitimate `set: {last_error: ""}` view reset
  # (error_log_survives_last_error_clear.yaml).
  bounced_silent_logged:
    terminal: true
    description: "Back at the lobby (silently, but logged)."
    on_enter:
      - set:
          last_error: ""
    view: |
      ⚠ Action failed: {{ world.error_log.0.message }}
      Back at the lobby. Try again when ready.

  # working_acked: ack_error: declared instead of on_error: — the deliberate
  # "record it, keep going" primitive. No `on:` handlers, same as
  # working_unhandled, so the session simply stays put after the acked
  # call — but unlike working_unhandled, the never-silent banner must NOT
  # appear: an acknowledged failure is a documented degrade, not a leak.
  working_acked:
    description: "Running the command (ack_error: declared)…"
    view: |
      Running…
    on_enter:
      - invoke: host.run
        with:
          cmd: "false"
        ack_error: "flow-fixture: acknowledged failure, safe to continue"
